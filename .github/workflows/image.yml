# 1つのリリースの Linux ビルドを ghcr.io/nercone-infra/openssl:<version>
# (linux/amd64 + linux/arm64)として公開し、cosign(keyless)で署名する。
#   - 新しいリリースごとに build.yml から呼び出される。
#   - 既存のリリースのイメージを公開するときは手動で実行する。
name: Publish OpenSSL image

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenSSL Version (x.y.z)'
        required: true
        type: string
      replace:
        description: 'Replace an image that already exists for this version'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      OPENSSL_VERSION: ${{ inputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/openssl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "openssl-${OPENSSL_VERSION}" -R "${{ github.repository }}" -D archives \
            -p "openssl-${OPENSSL_VERSION}-linux-x86_64.tar.gz" \
            -p "openssl-${OPENSSL_VERSION}-linux-aarch64.tar.gz" \
            -p SHA384SUMS

      - name: Prepare context
        run: image/prepare.sh "${OPENSSL_VERSION}" archives context

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 各バージョンのイメージは一度だけ公開する。利用側は <version>@<digest> で固定し、ダイジェストの
      # 変更を自動で取り込むため、同じバージョンを作り直すと全利用側に更新が届く。置き換えは replace を指定した場合に限る。
      - name: Refuse to replace an existing image
        if: ${{ !inputs.replace }}
        # 「存在しない」と確認できた場合だけ先に進む。認証やネットワークのエラーで公開に進まないよう、
        # それ以外の失敗はすべてエラーにする。buildx は存在しないタグを "ERROR: <ref>: not found" と報告する。
        run: |
          set -uo pipefail
          reference="${IMAGE}:${OPENSSL_VERSION}"
          if output=$(docker buildx imagetools inspect "${reference}" 2>&1); then
            echo "${reference} already exists (run with replace to publish it again)" >&2
            exit 1
          fi
          if [[ "${output}" != *"${reference}: not found"* ]]; then
            echo "could not check whether ${reference} exists:" >&2
            echo "${output}" >&2
            exit 1
          fi

      # RUN ステップがないため、両プラットフォームともエミュレーションなしでこのランナーでビルドできる。
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.description=OpenSSL ${{ inputs.version }} (Linux builds of nercone-infra/openssl)

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
